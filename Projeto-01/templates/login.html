{% extends "base.html" %}

{% block title %}Login - The Science of Fashion{% endblock %}

{% block content %}
<div class="login-page">
    <section class="login-section">
        <div class="container-small">
            
            <div class="form-wrapper">
                <header class="form-header">
                    <h1 class="form-title">Entrar</h1>
                    <p class="form-subtitle">Retome sua jornada cientifica na moda.</p>
                </header>

                <form id="login-form"
                      class="form-main"
                      hx-post="/login" 
                      hx-target="#resultado" 
                      hx-swap="innerHTML">
                    
                    <div class="form-row">
                        <label for="username">Nome de Usuário</label>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               required 
                               placeholder="Seu username">
                    </div>

                    <div class="form-row">
                        <label for="senha">Senha</label>
                        <input type="password" 
                               id="senha" 
                               name="senha" 
                               required 
                               placeholder="Sua senha">
                    </div>

                    <div id="resultado" class="form-feedback"></div>

                    <button type="submit" class="btn-primary full-width">
                        Acessar Conta
                    </button>
                </form>

                <footer class="form-footer">
                    <p>Ainda nao tem conta? <a href="/usuarios/cadastro" hx-get="/usuarios/cadastro" hx-target="#main-content" hx-push-url="true">Cadastre-se</a></p>
                </footer>
            </div>

        </div>
    </section>
</div>
{% endblock %}
