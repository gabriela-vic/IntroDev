<div class="cadastro-page">
    <section class="cadastro-section">
        <div class="container-small">
            
            <div class="form-wrapper">
                <header class="form-header">
                    <h1 class="form-title">Criar Conta</h1>
                    <p class="form-subtitle">Junte-se à nossa comunidade científica têxtil.</p>
                </header>

                <form id="cadastro-form"
                      class="form-main"
                      hx-post="/usuarios/cadastro" 
                      hx-target="#resultado" 
                      hx-swap="innerHTML">

                    <div class="form-row">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Seu nome">
                    </div>

                    <div class="form-row">
                        <label for="username">Nome de Usuário</label>
                        <input type="text" id="username" name="username" required placeholder="Ex: gabi_victor">
                    </div>

                    <div class="form-row">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-row">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required placeholder="Sua senha">
                    </div>

                    <div class="form-row">
                        <label for="confirmar_senha">Confirmar Senha</label>
                        <input type="password" id="confirmar_senha" name="confirmar_senha" required placeholder="Repita a senha">
                    </div>

                    <div id="resultado" class="form-feedback"></div>

                    <button type="submit" class="btn-primary full-width">Finalizar Cadastro</button>
                </form>

                <footer class="form-footer">
                    <p>Já possui cadastro? <a href="/login" hx-get="/login" hx-target="#main-content" hx-push-url="true">Entrar</a></p>
                </footer>
            </div>

        </div>
    </section>
</div>
