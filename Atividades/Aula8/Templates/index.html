<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Exercício Aula 8 - HTMX</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">>
    <style>
        .active { border: 2px solid blue; }
        nav button { margin: 5px; padding: 10px; cursor: pointer; }

        
        .tab-button:focus, .tab-button.active {
            background-color: #2c3e50; 
            color: white;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); 
            outline: none;
        }


        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            transition: all 0.2s;
        }
    </style>
</head>
<body>
    <h1>Meu Site com HTMX</h1>
    
    <nav>
        <button class="tab-button" hx-get="/abas/curtidas" hx-target="#conteudo" hx-push-url="true">Curtidas</button>
        <button class="tab-button" hx-get="/abas/jupiter" hx-target="#conteudo" hx-push-url="true">Júpiter</button>
        <button class="tab-button" hx-get="/abas/professor" hx-target="#conteudo" hx-push-url="true">Professor</button>
    </nav>

    <hr>

    <main id="conteudo" 
      hx-get="{{ pagina_inicial if pagina_inicial else '/abas/curtidas' }}" 
      hx-trigger="load">
    </main>

    <div hx-get="/proxima_aba" 
         hx-trigger="keyup[shiftKey&&altKey&&(code=='KeyP')] from:body" 
         hx-target="#conteudo">
    </div>

</body>
</html>
